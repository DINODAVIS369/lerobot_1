controller_manager:
  ros__parameters:
    update_rate: 10  # Reduced for serial stability
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


arm_controller:
  ros__parameters:
    joints:
      - "joint1"
      - "joint2"
      - "joint3"
      - "joint4"
      - "joint5"

    command_interfaces:
      - position

    state_interfaces:
      - position

    allow_nonzero_velocity_at_trajectory_end: true
    allow_integration_in_goal_trajectories: true

    constraints:
      goal_time: 10.0
      stopped_velocity_tolerance: 100.0
      joint1: { goal: 0.2 }
      joint2: { goal: 0.2 }
      joint3: { goal: 0.2 }
      joint4: { goal: 0.2 }
      joint5: { goal: 0.2 }


gripper_controller:
  ros__parameters:
    joints:
      - "joint6"

    command_interfaces:
      - position

    state_interfaces:
      - position

    allow_nonzero_velocity_at_trajectory_end: true
    allow_integration_in_goal_trajectories: true

    constraints:
      goal_time: 10.0
      stopped_velocity_tolerance: 100.0
      joint6: { goal: 0.2 }